<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kraftbuch</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="theme-color" content="#1f6f5c">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{--bg:#f6f5f2;--card:#fff;--text:#1d1d1b;--muted:#6b6a66;--line:#e3e1db;--accent:#1f6f5c;--accent-ink:#fff;--warn:#b5651d;--good:#2e7d32;--c3:#5a6fb0;--c4:#a04a7a;--soft:#eef4f1;--rot:#c0392b;--rot-bg:#fdf0ee;--r:14px}
@media (prefers-color-scheme: dark){:root{--bg:#141413;--card:#1e1e1c;--text:#ecebe6;--muted:#9c9a93;--line:#2f2e2b;--accent:#4fb39a;--accent-ink:#0d1f1a;--warn:#e0a060;--good:#7cc47f;--c3:#8fa3e6;--c4:#d98bb8;--soft:#1f2a26;--rot:#f08070;--rot-bg:#2e1c1a}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(12px + env(safe-area-inset-top)) 16px 8px;display:flex;justify-content:space-between;align-items:center;max-width:640px;margin:0 auto}
h1{font-size:21px;margin:0;letter-spacing:-.01em}
h2{font-size:19px;margin:0 0 10px}
main{padding:0 16px calc(90px + env(safe-area-inset-bottom));max-width:640px;margin:0 auto}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:6}
nav button{flex:1;padding:14px 4px;border:0;background:none;color:var(--muted);font-size:15px;font-weight:500}
nav button.active{color:var(--accent);font-weight:700}
.hidden{display:none!important}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin:10px 0}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.title{font-weight:650;font-size:17px}
.muted{color:var(--muted)}.small{font-size:13px}
.last{margin-top:8px}
.ziel{margin-top:6px;font-size:14px}
.hint{margin-top:8px;padding:8px 10px;border-radius:10px;font-size:14px;background:var(--soft)}
.hint.steigern{color:var(--good);font-weight:600}
.hint.reduzieren{color:var(--warn)}
button{font:inherit;cursor:pointer;border-radius:10px}
.primary{background:var(--accent);color:var(--accent-ink);border:0;padding:10px 16px;font-weight:600}
.ghost{background:none;border:1px solid var(--line);color:var(--text);padding:9px 14px}
.link{background:none;border:0;color:var(--accent);padding:8px 0 0;font-size:14px}
button.small{padding:6px 10px;font-size:13px}
.block{width:100%;margin-top:6px;padding:13px}
.danger{color:#c0392b;border-color:#e6b0aa}
label{display:block;font-size:13px;color:var(--muted);margin:10px 0 0}
input,select{display:block;width:100%;margin-top:4px;padding:11px 12px;font:inherit;font-size:16px;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:10px}
input:focus{outline:2px solid var(--accent);outline-offset:-1px}
.check{display:flex;align-items:center;gap:8px;color:var(--text);font-size:15px}
.check input{width:auto;margin:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.reps{display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:8px}
.satz{display:grid;grid-template-columns:62px 1fr 1fr;gap:4px 10px;align-items:end;margin-top:4px}
.satz .nr{padding-bottom:13px;font-weight:600;font-size:14px}
.satz .zuvor{grid-column:2/4;font-size:12px;color:var(--muted)}
table.saetze{border-collapse:collapse;margin-top:6px;font-size:15px;font-variant-numeric:tabular-nums}
table.saetze th{font-size:12px;font-weight:500;color:var(--muted);text-align:right;padding:0 0 2px 18px}
table.saetze td{padding:2px 0 2px 18px;text-align:right;font-weight:600}
table.saetze td:first-child,table.saetze th:first-child{padding-left:0;text-align:left;font-weight:400;color:var(--muted)}
.geraet.trainiert{border-color:var(--rot);background:var(--rot-bg)}
.geraet.trainiert .title{color:var(--rot)}
.geraet.pausiert{opacity:.55;padding:10px 14px}
.pool{gap:12px;padding:10px 12px}
.star{background:none;border:0;font-size:26px;line-height:1;padding:4px 2px;color:var(--muted);min-width:34px}
.star.an{color:#e0a800}
.abschnitt{margin:18px 0 0;font-size:12px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.05em}
input:disabled{opacity:.6}
.chip{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:999px;vertical-align:2px;letter-spacing:.02em;color:#fff}
.chip.push{background:#c2410c}.chip.pull{background:#1d4ed8}.chip.beine{background:#15803d}.chip.rumpf{background:#6b7280}
.plan{padding:12px 14px}
.umschalter{display:flex;align-items:center;gap:6px;margin-top:10px}
.umschalter button{border:1px solid var(--line);background:var(--bg);color:var(--text);padding:5px 10px;font-size:13px}
.umschalter button.an{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
select{display:block;width:100%;margin-top:4px;padding:11px 12px;font:inherit;font-size:16px;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:10px}
.gruppe{margin:22px 2px 4px;font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.stepper{display:flex;align-items:center;gap:14px}
.stepper button{width:40px;height:40px;border:1px solid var(--line);background:var(--bg);color:var(--text);font-size:20px}
.form .row{margin-top:12px}
.actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px;flex-wrap:wrap}
.actions .spacer{flex:1}
.timer{display:flex;align-items:flex-end}
.timer button{width:100%;padding:11px}
.timer button.running{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-variant-numeric:tabular-nums}
.item{display:flex;justify-content:space-between;align-items:center;gap:10px}
.list .item{padding:10px 0;border-bottom:1px solid var(--line)}
.list .item:last-child{border-bottom:0}
.chartbox{position:relative;height:220px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center}
.stats b{display:block;font-size:18px}
.stats span{font-size:12px;color:var(--muted)}
.stats .full{grid-column:1/-1;margin-top:4px}
.badge{font-size:11px;font-weight:500;padding:2px 6px;border-radius:6px;background:var(--line);color:var(--muted);vertical-align:middle}
dialog{border:0;border-radius:18px;padding:18px;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 40px);background:var(--card);color:var(--text)}
dialog::backdrop{background:rgba(0,0,0,.45)}
.toast{position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:50;max-width:90vw}
.toast.err{background:#c0392b;color:#fff}
.empty{text-align:center;padding:28px 14px}
@media (max-width:380px){.stats{grid-template-columns:repeat(2,1fr)}.grid3{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<header><h1>Kraftbuch</h1><button id="logoutBtn" class="ghost small hidden">Konto</button></header>
<main id="app"><p class="muted">Lade …</p></main>
<nav id="nav" class="hidden">
  <button data-tab="training" class="active">Training</button>
  <button data-tab="geraete">Geräte</button>
  <button data-tab="koerper">Körper</button>
</nav>
<dialog id="dlg"><div id="dlgBody"></div></dialog>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="config.js"></script>
<script>
(() => {
'use strict';
const cfg = window.KRAFTBUCH_CONFIG || {};
const app = document.getElementById('app');
const nav = document.getElementById('nav');
const dlg = document.getElementById('dlg');
const dlgBody = document.getElementById('dlgBody');
const logoutBtn = document.getElementById('logoutBtn');
const $ = s => document.querySelector(s);

if (!cfg.url || cfg.url.includes('DEIN-PROJEKT') || !window.supabase) {
  app.innerHTML = `<div class="card"><h2>Einrichtung fehlt</h2><p>Bitte in <code>config.js</code> die Supabase-URL und den anon/publishable Key eintragen.</p></div>`;
  return;
}
const sb = window.supabase.createClient(cfg.url, cfg.anonKey);
const S = { user: null, tab: 'training', geraete: [], meine: [], eintraege: [], koerper: [], suche: '' };
const KATEGORIEN = ['Brust', 'Rücken', 'Beine', 'Schultern', 'Arme', 'Bauch', 'Sonstiges'];

// ---------- Helfer ----------
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const heute = () => new Date().toLocaleDateString('sv-SE');
const fmt = n => (n == null || n === '' || isNaN(n)) ? '–' : Number(n).toLocaleString('de-DE', { maximumFractionDigits: 2 });
const fmtDatum = d => new Date(d + 'T00:00:00').toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit', year: '2-digit' });
const num = v => (v === '' || v == null) ? null : Number(String(v).replace(',', '.'));
const summe = a => a.reduce((x, y) => x + y, 0);

let toastT;
function toast(msg, err) {
  let t = $('.toast'); if (!t) { t = document.createElement('div'); document.body.appendChild(t); }
  t.className = 'toast' + (err ? ' err' : ''); t.textContent = msg;
  clearTimeout(toastT); toastT = setTimeout(() => t.remove(), err ? 4500 : 2000);
}
async function q(p) { const { data, error } = await p; if (error) { toast(error.message, true); throw error; } return data; }
const sortE = () => S.eintraege.sort((a, b) => b.datum.localeCompare(a.datum) || b.erstellt_am.localeCompare(a.erstellt_am));
const sortK = () => S.koerper.sort((a, b) => b.datum.localeCompare(a.datum) || b.erstellt_am.localeCompare(a.erstellt_am));
const sortG = () => S.geraete.sort((a, b) => a.name.localeCompare(b.name, 'de'));
const letzter = id => S.eintraege.find(x => x.geraet_id === id);
const eintraegeVon = id => S.eintraege.filter(x => x.geraet_id === id);
const mein = id => S.meine.find(m => m.geraet_id === id);           // meine Favoriten-Zeile (oder undefined)
const vonMir = g => g.user_id === S.user?.id;                          // habe ich das Gerät im Pool angelegt?

function zerstoereCharts(root) { if (window.Chart) root.querySelectorAll('canvas').forEach(c => Chart.getChart(c)?.destroy()); }
function setApp(html) { zerstoereCharts(app); app.innerHTML = html; }
function oeffneDlg(html) { zerstoereCharts(dlgBody); stopTimer(); dlgBody.innerHTML = html; if (!dlg.open) dlg.showModal(); dlgBody.scrollTop = 0; }
dlg.addEventListener('close', () => { stopTimer(); zerstoereCharts(dlgBody); });
dlgBody.addEventListener('click', e => { if (e.target.closest('[data-close]')) dlg.close(); });

// ---------- Gewichte pro Satz ----------
// Ältere Einträge haben nur ein Gewicht (gewicht_kg) für alle Sätze.
function gewichteVon(e) {
  const r = e.wiederholungen || [];
  return (e.gewichte && e.gewichte.length) ? e.gewichte.map(Number) : r.map(() => Number(e.gewicht_kg));
}
const saetzeText = e => { const w = gewichteVon(e); return e.wiederholungen.map((r, i) => `${fmt(w[i])}×${r}`).join(' · '); };
const volumen = e => { const w = gewichteVon(e); return summe(e.wiederholungen.map((r, i) => r * w[i])); };

// Tabelle "Satz | kg | Wdh." für den letzten Eintrag
function letzteTabelle(e) {
  const w = gewichteVon(e);
  return `<table class="saetze"><tr><th></th><th>kg</th><th>Wdh.</th></tr>${e.wiederholungen.map((r, i) =>
    `<tr><td>Satz ${i + 1}</td><td>${fmt(w[i])}</td><td>${r}</td></tr>`).join('')}</table>`;
}

// ---------- Einfacher Trainingsplan ----------
// Wurde ein Gerät vor weniger als RUHE_TAGE Tagen trainiert, ist es rot und rutscht nach unten.
// Pausierte Geräte (aktiv = false) stehen ganz unten.
const RUHE_TAGE = Number(cfg.ruheTage) || 3;
function tageSeit(datum) {
  const a = new Date(datum + 'T00:00:00'), b = new Date(heute() + 'T00:00:00');
  return Math.round((b - a) / 86400000);
}
const wannText = t => t <= 0 ? 'heute' : t === 1 ? 'gestern' : `vor ${t} Tagen`;
// ---------- Push / Pull / Beine / Rumpf ----------
const GRUPPEN = { push: 'Push', pull: 'Pull', beine: 'Beine', rumpf: 'Rumpf' };
const PLAN_GRUPPEN = ['push', 'pull', 'beine'];        // Rumpf läuft nebenher, kein eigener Tag
// Vorschlag aus dem Gerätenamen. Reihenfolge wichtig: "Rückenstrecker" vor "Rücken", "Beincurl" vor "Curl" usw.
const NAMENSREGELN = [
  [/bauch|abdom|crunch|sit.?up|rückenstreck|rueckenstreck|hyperext|lower.?back|rumpf|core|rotation|torso|plank/, 'rumpf', 'Bauch'],
  [/bein|leg|squat|kniebeug|hack|wade|calf|waden|abdukt|addukt|gesäß|gesaess|glute|hip.?thrust|po.?maschine/, 'beine', 'Beine'],
  [/reverse|rear.?delt|hintere.?schulter|face.?pull/, 'pull', 'Schultern'],
  [/trizeps|triceps|dips|french|pushdown/, 'push', 'Arme'],
  [/bizeps|biceps|curl|hammer/, 'pull', 'Arme'],
  [/schulter|shoulder|seitheb|lateral|military|overhead|nacken/, 'push', 'Schultern'],
  [/brust|chest|bank|bench|butterfly|fly|pec|liegestütz|push.?up|drück|druck|press/, 'push', 'Brust'],
  [/lat|ruder|row|klimmzug|pull.?up|chin.?up|pulldown|zug|rücken|ruecken|back/, 'pull', 'Rücken'],
];
function ausName(name) {
  const n = (name || '').toLowerCase();
  for (const [re, gruppe, kategorie] of NAMENSREGELN) if (re.test(n)) return { gruppe, kategorie };
  return { gruppe: null, kategorie: null };
}
// Meine Zuordnung > Pool-Zuordnung > Vorschlag aus dem Namen
const gruppeVon = g => mein(g.id)?.gruppe || g.gruppe || ausName(g.name).gruppe;

// Rot pro Gerät oder pro Gruppe (merkt sich das Handy)
let rotModus = 'geraet';
try { rotModus = localStorage.getItem('kraftbuch-rot') === 'gruppe' ? 'gruppe' : 'geraet'; } catch {}
const setRotModus = v => { rotModus = v; try { localStorage.setItem('kraftbuch-rot', v); } catch {} };

// Letztes Trainingsdatum einer Gruppe (über alle meine Favoriten dieser Gruppe)
function letztesDatumGruppe(gr) {
  let best = null;
  for (const g of S.geraete) {
    if (!mein(g.id) || gruppeVon(g) !== gr) continue;
    const e = letzter(g.id);
    if (e && (!best || e.datum > best)) best = e.datum;
  }
  return best;
}
// Welche Gruppe ist heute dran? Die, die am längsten nicht trainiert wurde (nur Gruppen mit aktiven Favoriten).
function heuteDran() {
  const liste = PLAN_GRUPPEN.filter(gr => S.geraete.some(g => mein(g.id) && !mein(g.id).pausiert && gruppeVon(g) === gr))
    .map(gr => ({ gr, datum: letztesDatumGruppe(gr) }));
  if (!liste.length) return { dran: null, liste };
  const sortiert = [...liste].sort((a, b) => (a.datum || '') < (b.datum || '') ? -1 : (a.datum || '') > (b.datum || '') ? 1 : 0);
  return { dran: sortiert[0].gr, liste };
}

function status(g) {
  const m = mein(g.id);
  if (!m) return 'pool';
  if (m.pausiert) return 'pausiert';
  const gr = gruppeVon(g);
  const datum = rotModus === 'gruppe' && gr ? letztesDatumGruppe(gr) : letzter(g.id)?.datum;
  return datum && tageSeit(datum) < RUHE_TAGE ? 'trainiert' : 'frei';
}

// ---------- Pausen-Timer ----------
let timerId = null;
function stopTimer() { if (timerId) clearInterval(timerId); timerId = null; }
function startTimer(btn, sek) {
  stopTimer();
  const ende = Date.now() + sek * 1000;
  btn.classList.add('running');
  const tick = () => {
    const rest = Math.max(0, Math.round((ende - Date.now()) / 1000));
    btn.textContent = rest > 0 ? `${Math.floor(rest / 60)}:${String(rest % 60).padStart(2, '0')}  ✕` : 'Pause vorbei ✓';
    if (rest <= 0) { stopTimer(); btn.classList.remove('running'); navigator.vibrate?.([300, 150, 300]); }
  };
  tick(); timerId = setInterval(tick, 250);
}

// ---------- Login ----------
function renderLogin() {
  nav.classList.add('hidden'); logoutBtn.classList.add('hidden');
  setApp(`<form id="loginF" class="card">
    <h2>Anmelden</h2>
    <label>Benutzername<input type="text" name="email" autocomplete="username" autocapitalize="off" autocorrect="off" spellcheck="false" required></label>
    <label>Passwort<input type="password" name="pw" autocomplete="current-password" required></label>
    <button class="primary block" type="submit" style="margin-top:16px">Anmelden</button>
    <p class="muted small" id="loginMsg"></p>
  </form>`);
  $('#loginF').onsubmit = async e => {
    e.preventDefault(); const f = e.target; $('#loginMsg').textContent = '';
    const eingabe = f.email.value.trim().toLowerCase();
    const email = eingabe.includes('@') ? eingabe : `${eingabe}@${cfg.benutzerDomain || 'kraftbuch.local'}`;
    const { error } = await sb.auth.signInWithPassword({ email, password: f.pw.value });
    if (error) $('#loginMsg').textContent = 'Anmeldung fehlgeschlagen: ' + error.message;
  };
}
const benutzername = () => {
  const m = S.user?.email || '';
  const dom = '@' + (cfg.benutzerDomain || 'kraftbuch.local');
  return m.endsWith(dom) ? m.slice(0, -dom.length) : m;
};
logoutBtn.onclick = kontoDlg;
function kontoDlg() {
  oeffneDlg(`<form id="pwF" class="form">
    <h2>Konto</h2>
    <p class="muted">Angemeldet als <b>${esc(benutzername())}</b></p>
    <h2 style="font-size:16px;margin-top:18px">Passwort ändern</h2>
    <input type="text" name="u" autocomplete="username" value="${esc(benutzername())}" hidden>
    <label>Aktuelles Passwort<input type="password" name="alt" autocomplete="current-password" required></label>
    <label>Neues Passwort (mind. 8 Zeichen)<input type="password" name="neu" autocomplete="new-password" minlength="8" required></label>
    <label>Neues Passwort wiederholen<input type="password" name="neu2" autocomplete="new-password" minlength="8" required></label>
    <p class="small" id="pwMsg" style="color:#c0392b"></p>
    <div class="actions"><button type="button" class="ghost danger" id="abmelden">Abmelden</button><span class="spacer"></span>
      <button type="button" class="ghost" data-close>Schließen</button><button class="primary" type="submit">Speichern</button></div>
  </form>`);
  $('#abmelden').onclick = () => { dlg.close(); sb.auth.signOut(); };
  $('#pwF').onsubmit = async ev => {
    ev.preventDefault(); const f = ev.target, msg = $('#pwMsg'); msg.textContent = '';
    if (f.neu.value !== f.neu2.value) { msg.textContent = 'Die neuen Passwörter stimmen nicht überein.'; return; }
    if (f.neu.value === f.alt.value) { msg.textContent = 'Das neue Passwort muss sich vom alten unterscheiden.'; return; }
    const btn = f.querySelector('[type=submit]'); btn.disabled = true;
    try {
      const pruef = await sb.auth.signInWithPassword({ email: S.user.email, password: f.alt.value });
      if (pruef.error) { msg.textContent = 'Das aktuelle Passwort ist falsch.'; return; }
      const { error } = await sb.auth.updateUser({ password: f.neu.value });
      if (error) { msg.textContent = 'Ändern fehlgeschlagen: ' + error.message; return; }
      dlg.close(); toast('Passwort geändert ✓');
    } finally { btn.disabled = false; }
  };
}

sb.auth.onAuthStateChange((_ev, session) => {
  const u = session?.user || null;
  if (u && S.user && u.id === S.user.id) return; // z. B. Token-Erneuerung
  S.user = u;
  setTimeout(() => u ? start() : renderLogin(), 0);
});

async function start() {
  nav.classList.remove('hidden'); logoutBtn.classList.remove('hidden');
  setApp('<p class="muted">Lade …</p>');
  try {
    const [g, m, e, k] = await Promise.all([
      q(sb.from('geraete').select('*').order('name')),
      q(sb.from('meine_geraete').select('*')),
      q(sb.from('trainings_eintraege').select('*').order('datum', { ascending: false }).order('erstellt_am', { ascending: false }).limit(2000)),
      q(sb.from('koerperwerte').select('*').order('datum', { ascending: false }).order('erstellt_am', { ascending: false }).limit(1000))
    ]);
    S.geraete = g; S.meine = m; S.eintraege = e; S.koerper = k; sortG();
  } catch { setApp('<div class="card">Daten konnten nicht geladen werden. Ist <code>update-gemeinsame-geraete.sql</code> (bzw. bei Neuinstallation <code>schema.sql</code>) in Supabase ausgeführt?</div>'); return; }
  render();
}

// ---------- Navigation ----------
nav.onclick = e => { const b = e.target.closest('button'); if (!b) return; S.tab = b.dataset.tab; render(); };
function render() {
  nav.querySelectorAll('button').forEach(b => b.classList.toggle('active', b.dataset.tab === S.tab));
  ({ training: renderTraining, geraete: renderGeraete, koerper: renderKoerper })[S.tab]();
}

// ---------- Training (nur meine Favoriten) ----------
function renderTraining() {
  const favs = S.geraete.filter(g => mein(g.id));
  if (!favs.length) {
    setApp(`<div class="card empty"><p>Du hast noch keine Geräte in deinem Training.</p>
      <p class="muted small">Im Tab <b>Geräte</b> findest du den gemeinsamen Pool. Tippe dort auf ☆, um ein Gerät als Favorit in dein Training zu holen.</p>
      <button class="primary" id="zumPool">Zum Gerätepool</button></div>`);
    $('#zumPool').onclick = () => { S.tab = 'geraete'; render(); }; return;
  }
  const gruppen = { frei: [], trainiert: [], pausiert: [] };
  favs.forEach(g => gruppen[status(g)].push(g));
  const { dran, liste: planListe } = heuteDran();
  // Geräte der Gruppe, die heute dran ist, nach oben
  gruppen.frei.sort((a, b) => (gruppeVon(b) === dran) - (gruppeVon(a) === dran));
  const chip = g => { const gr = gruppeVon(g); return gr ? `<span class="chip ${gr}">${GRUPPEN[gr]}</span>` : ''; };
  const kopf = `<div class="card plan">
      ${dran ? `<div>Heute dran: <span class="chip ${dran}">${GRUPPEN[dran]}</span>
        <span class="muted small">${(() => { const d = planListe.find(x => x.gr === dran).datum; return d ? 'zuletzt ' + wannText(tageSeit(d)) : 'noch nie trainiert'; })()}</span></div>` : ''}
      ${planListe.length ? `<div class="muted small" style="margin-top:4px">${planListe.map(x => `${GRUPPEN[x.gr]}: ${x.datum ? wannText(tageSeit(x.datum)) : 'nie'}`).join(' · ')}</div>` : '<div class="muted small">Ordne deinen Geräten Push, Pull oder Beine zu (Geräte → Details), dann schlägt die App vor, was heute dran ist.</div>'}
      <div class="umschalter" role="group" aria-label="Roter Rahmen">
        <span class="muted small">Rot:</span>
        <button type="button" data-rot="geraet" class="${rotModus === 'geraet' ? 'an' : ''}">pro Gerät</button>
        <button type="button" data-rot="gruppe" class="${rotModus === 'gruppe' ? 'an' : ''}">pro Gruppe</button>
      </div></div>`;
  const karte = g => {
    const e = letzter(g.id), st = status(g), m = mein(g.id);
    if (st === 'pausiert') return `<div class="card geraet pausiert" data-id="${g.id}"><div class="row">
      <div><div class="title">${esc(g.name)} ${chip(g)}</div><div class="muted small">pausiert – derzeit nicht genutzt</div></div>
      <button class="ghost small" data-act="pause">▶ Wieder nutzen</button></div></div>`;
    return `<div class="card geraet ${st}" data-id="${g.id}">
      <div class="row"><div><div class="title">${esc(g.name)} ${chip(g)}</div>
        <div class="muted small">${[g.kategorie ? esc(g.kategorie) : '', e ? `zuletzt ${wannText(tageSeit(e.datum))}` : ''].filter(Boolean).join(' · ')}</div></div>
      <button class="primary" data-act="log">Eintragen</button></div>
      ${m.notiz ? `<div class="muted small" style="margin-top:4px">⚙ ${esc(m.notiz)}</div>` : ''}
      ${e ? `<div class="last">${letzteTabelle(e)}</div>` : '<div class="last muted">Noch kein Eintrag</div>'}
      ${e?.ziel_naechstes_mal ? `<div class="ziel">🎯 ${esc(e.ziel_naechstes_mal)}</div>` : ''}
      ${e?.notiz ? `<div class="muted small" style="margin-top:4px">${esc(e.notiz)}</div>` : ''}
      <div class="row" style="margin-top:4px">${e ? '<button class="link" data-act="verlauf">Verlauf</button>' : '<span></span>'}
        <button class="link muted" data-act="pause">Pausieren</button></div>
    </div>`;
  };
  const titel = (t, n) => n ? `<div class="gruppe">${t}</div>` : '';
  setApp(kopf + gruppen.frei.map(karte).join('')
    + titel(`Kürzlich trainiert (letzte ${RUHE_TAGE} Tage${rotModus === 'gruppe' ? ', ganze Gruppe' : ''})`, gruppen.trainiert.length) + gruppen.trainiert.map(karte).join('')
    + titel('Pausiert', gruppen.pausiert.length) + gruppen.pausiert.map(karte).join(''));
  app.querySelectorAll('[data-rot]').forEach(b => b.onclick = () => { setRotModus(b.dataset.rot); render(); });
  app.querySelectorAll('.geraet').forEach(el => {
    const g = S.geraete.find(x => x.id === el.dataset.id);
    el.querySelector('[data-act=log]')?.addEventListener('click', () => logForm(g));
    el.querySelector('[data-act=verlauf]')?.addEventListener('click', () => verlauf(g));
    el.querySelector('[data-act=pause]').onclick = async () => {
      const m = mein(g.id);
      const upd = await q(sb.from('meine_geraete').update({ pausiert: !m.pausiert }).eq('user_id', S.user.id).eq('geraet_id', g.id).select().single());
      Object.assign(m, upd); toast(m.pausiert ? 'Pausiert' : 'Wieder aktiv'); render();
    };
  });
}

function logForm(g) {
  const e = letzter(g.id), m = mein(g.id);
  const pauseStd = m?.pause_sek ?? 90;
  const alteWdh = e?.wiederholungen || [];
  const startGew = e ? gewichteVon(e) : [];
  let anz = e ? Math.max(alteWdh.length, 1) : (m?.saetze ?? 3);
  oeffneDlg(`<form id="logF" class="form">
    <h2>${esc(g.name)}</h2>
    ${e ? `<div class="hint"><b>Letztes Mal (${wannText(tageSeit(e.datum))}, ${fmtDatum(e.datum)}):</b>${letzteTabelle(e)}</div>` : '<div class="hint">Erstes Training an diesem Gerät</div>'}
    ${e?.ziel_naechstes_mal ? `<div class="ziel">🎯 Dein Ziel: ${esc(e.ziel_naechstes_mal)}</div>` : ''}
    ${m?.notiz ? `<div class="muted small" style="margin-top:6px">⚙ ${esc(m.notiz)}</div>` : ''}
    <label>Datum<input type="date" name="datum" value="${heute()}" required></label>
    <div class="row"><span>Sätze</span><div class="stepper"><button type="button" data-d="-1">−</button><b id="satzAnz">${anz}</b><button type="button" data-d="1">+</button></div></div>
    <div id="repsBox"></div>
    <div class="grid2">
      <label>Pause (Sek.)<input name="pause" type="number" inputmode="numeric" min="0" value="${e?.pause_sek ?? pauseStd}"></label>
      <div class="timer"><button type="button" id="timerBtn" class="ghost">Pause starten</button></div>
    </div>
    <label>Ziel fürs nächste Mal<input name="ziel" placeholder="z. B. alle 3 Sätze 8 Wdh."></label>
    <label>Notiz<input name="notiz" placeholder="optional, z. B. Sitzhöhe 4"></label>
    <div class="actions"><button type="button" class="ghost" data-close>Abbrechen</button><button class="primary" type="submit">Speichern</button></div>
  </form>`);
  const box = $('#repsBox');
  const zeichne = () => {
    const altKg = [...box.querySelectorAll('[data-kg]')].map(i => i.value);
    const altW = [...box.querySelectorAll('[data-wdh]')].map(i => i.value);
    box.innerHTML = Array.from({ length: anz }, (_, i) => {
      const kg = altKg[i] ?? (startGew[i] != null ? fmt(startGew[i]) : (altKg[i - 1] ?? (startGew.length ? fmt(startGew[startGew.length - 1]) : '')));
      const zuvor = alteWdh[i] != null ? `zuvor ${fmt(startGew[i])} kg × ${alteWdh[i]}` : '';
      return `<div class="satz"><span class="nr">Satz ${i + 1}</span>
        <label>kg<input data-kg inputmode="decimal" value="${kg}" required></label>
        <label>Wdh.<input data-wdh type="number" inputmode="numeric" min="0" max="999" value="${altW[i] ?? ''}" placeholder="${alteWdh[i] ?? ''}" required></label>
        ${zuvor ? `<span class="zuvor">${zuvor}</span>` : ''}</div>`;
    }).join('');
    $('#satzAnz').textContent = anz;
  };
  zeichne();
  dlgBody.querySelectorAll('.stepper button').forEach(b => b.onclick = () => { anz = Math.max(1, Math.min(10, anz + Number(b.dataset.d))); zeichne(); });
  const tb = $('#timerBtn');
  tb.onclick = () => {
    if (timerId) { stopTimer(); tb.classList.remove('running'); tb.textContent = 'Pause starten'; return; }
    startTimer(tb, num($('#logF').pause.value) || pauseStd);
  };
  $('#logF').onsubmit = async ev => {
    ev.preventDefault(); const f = ev.target;
    const wdh = [...box.querySelectorAll('[data-wdh]')].map(i => parseInt(i.value, 10));
    const kgs = [...box.querySelectorAll('[data-kg]')].map(i => num(i.value));
    if (wdh.some(isNaN)) return toast('Bitte bei allen Sätzen die Wiederholungen eintragen', true);
    if (kgs.some(x => x == null || isNaN(x))) return toast('Bitte bei allen Sätzen ein gültiges Gewicht eintragen', true);
    const row = { geraet_id: g.id, datum: f.datum.value, gewicht_kg: Math.max(...kgs), gewichte: kgs, wiederholungen: wdh, pause_sek: num(f.pause.value), ziel_naechstes_mal: f.ziel.value.trim() || null, notiz: f.notiz.value.trim() || null };
    const res = await sb.from('trainings_eintraege').insert(row).select().single();
    if (res.error) {
      const fehltSpalte = /gewichte/i.test(res.error.message);
      return toast(fehltSpalte ? 'Datenbank-Update fehlt: bitte update-gewichte-pro-satz.sql in Supabase ausführen' : res.error.message, true);
    }
    const neu = res.data;
    S.eintraege.unshift(neu); sortE(); dlg.close(); toast('Gespeichert 💪'); render();
  };
}

function verlauf(g) {
  const liste = eintraegeVon(g.id);
  oeffneDlg(`<h2>${esc(g.name)}</h2>
    ${liste.length > 1 && window.Chart ? '<div class="chartbox"><canvas id="vChart"></canvas></div>' : ''}
    <div class="list">${liste.map(e => `<div class="item"><div><b>${fmtDatum(e.datum)}</b> · ${saetzeText(e)}${e.pause_sek ? ` · ${e.pause_sek}s` : ''}
      ${e.ziel_naechstes_mal ? `<div class="muted small">🎯 ${esc(e.ziel_naechstes_mal)}</div>` : ''}${e.notiz ? `<div class="muted small">${esc(e.notiz)}</div>` : ''}</div>
      <button class="ghost small" data-del="${e.id}">Löschen</button></div>`).join('') || '<p class="muted">Noch keine Einträge.</p>'}</div>
    <div class="actions"><button class="ghost" data-close>Schließen</button></div>`);
  if (liste.length > 1 && window.Chart) {
    const asc = [...liste].reverse();
    linienChart($('#vChart'), asc.map(e => fmtDatum(e.datum)), [
      { label: 'Höchstes Gewicht (kg)', data: asc.map(e => Math.max(...gewichteVon(e))), yAxisID: 'y' },
      { label: 'Volumen (kg × Wdh.)', data: asc.map(volumen), yAxisID: 'y1' }
    ]);
  }
  dlgBody.querySelectorAll('[data-del]').forEach(b => b.onclick = async () => {
    if (!confirm('Diesen Eintrag löschen?')) return;
    await q(sb.from('trainings_eintraege').delete().eq('id', b.dataset.del));
    S.eintraege = S.eintraege.filter(x => x.id !== b.dataset.del);
    render(); eintraegeVon(g.id).length ? verlauf(g) : dlg.close();
  });
}

// ---------- Gerätepool (für alle) ----------
async function favoritAn(g, werte = {}) {
  const row = await q(sb.from('meine_geraete').upsert({ user_id: S.user.id, geraet_id: g.id, saetze: 3, pause_sek: 90, ...werte }).select().single());
  S.meine = S.meine.filter(m => m.geraet_id !== g.id); S.meine.push(row);
}
async function favoritAus(g) {
  await q(sb.from('meine_geraete').delete().eq('user_id', S.user.id).eq('geraet_id', g.id));
  S.meine = S.meine.filter(m => m.geraet_id !== g.id);
}

function renderGeraete() {
  setApp(`<div class="row" style="gap:8px">
      <input id="suche" type="search" placeholder="Gerät suchen …" value="${esc(S.suche)}" autocomplete="off" style="margin:0">
      <button class="primary" id="neuG" style="white-space:nowrap">+ Neu</button></div>
    <p class="muted small" style="margin:8px 2px 0">Gemeinsamer Pool aller Nutzer. ★ = in deinem Training.</p>
    <div id="poolListe"></div>`);
  $('#neuG').onclick = () => geraetForm();
  $('#suche').oninput = ev => { S.suche = ev.target.value; zeichnePool(); };
  zeichnePool();
}

function zeichnePool() {
  const box = $('#poolListe'); if (!box) return;
  const such = S.suche.trim().toLowerCase();
  const treffer = S.geraete.filter(g => !such || g.name.toLowerCase().includes(such) || (g.kategorie || '').toLowerCase().includes(such));
  const favs = treffer.filter(g => mein(g.id)), rest = treffer.filter(g => !mein(g.id));
  const zeile = g => {
    const m = mein(g.id);
    const gr = gruppeVon(g);
    const info = [gr ? GRUPPEN[gr] : '', g.kategorie && g.kategorie !== GRUPPEN[gr] ? esc(g.kategorie) : '', vonMir(g) ? 'von dir angelegt' : '', m?.pausiert ? 'pausiert' : ''].filter(Boolean).join(' · ');
    return `<div class="card item pool" data-id="${g.id}">
      <button class="star ${m ? 'an' : ''}" data-act="star" aria-label="${m ? 'Aus meinem Training entfernen' : 'In mein Training übernehmen'}">${m ? '★' : '☆'}</button>
      <div style="flex:1;min-width:0"><div class="title">${esc(g.name)}</div>${info ? `<div class="muted small">${info}</div>` : ''}</div>
      <button class="ghost small" data-act="edit">Details</button></div>`;
  };
  box.innerHTML = (!treffer.length ? `<div class="card empty muted">${such ? 'Kein Gerät gefunden.' : 'Der Pool ist noch leer.'}</div>` : '')
    + (favs.length ? `<div class="gruppe">Mein Training (${favs.length})</div>` + favs.map(zeile).join('') : '')
    + (rest.length ? `<div class="gruppe">Weitere Geräte im Pool (${rest.length})</div>` + rest.map(zeile).join('') : '');
  box.querySelectorAll('.pool').forEach(el => {
    const g = S.geraete.find(x => x.id === el.dataset.id);
    el.querySelector('[data-act=star]').onclick = async () => {
      if (mein(g.id)) { await favoritAus(g); toast('Aus deinem Training entfernt'); }
      else { await favoritAn(g); toast('★ In dein Training übernommen'); }
      zeichnePool();
    };
    el.querySelector('[data-act=edit]').onclick = () => geraetForm(g);
  });
}

function gruppeSelect(name, wert, aus, leerText = '– keine –') {
  return `<select name="${name}" ${aus ? 'disabled' : ''}><option value="">${leerText}</option>${Object.entries(GRUPPEN).map(([k, v]) =>
    `<option value="${k}" ${wert === k ? 'selected' : ''}>${v}</option>`).join('')}</select>`;
}
function geraetForm(g) {
  const neu = !g, darfPool = neu || vonMir(g), m = g ? mein(g.id) : null;
  const d = g || { name: '', kategorie: '' };
  const pers = m || { saetze: 3, pause_sek: 90, notiz: '', pausiert: false };
  const zeigePers = neu || !!m;
  oeffneDlg(`<form id="gF" class="form">
    <h2>${neu ? 'Neues Gerät im Pool' : esc(g.name)}</h2>
    <div class="abschnitt">Gerät (für alle sichtbar)</div>
    <label>Name<input name="name" value="${esc(d.name)}" placeholder="z. B. Brustpresse" required ${darfPool ? '' : 'disabled'}></label>
    <div class="grid2">
      <label>Muskelgruppe<input name="kategorie" list="katList" value="${esc(d.kategorie || (neu ? '' : ausName(d.name).kategorie || ''))}" placeholder="optional" ${darfPool ? '' : 'disabled'}></label>
      <label>Push / Pull${gruppeSelect('gruppe', d.gruppe || (neu ? '' : ausName(d.name).gruppe || ''), !darfPool)}</label>
    </div>
    <datalist id="katList">${KATEGORIEN.map(k => `<option value="${k}">`).join('')}</datalist>
    <p class="muted small" id="vorschlagHinweis" style="margin:6px 0 0">${darfPool ? (neu ? 'Wird beim Tippen des Namens vorgeschlagen – du kannst es ändern.' : '') : 'Von jemand anderem angelegt – Name, Muskelgruppe und Push/Pull für alle kann nur der Ersteller ändern. Deine eigene Zuordnung kannst du unten festlegen.'}</p>
    ${zeigePers ? `<div class="abschnitt">Meine Einstellungen (nur für dich)</div>
    <div class="grid2">
      <label>Sätze (beim 1. Mal)<input name="saetze" type="number" inputmode="numeric" min="1" max="10" value="${pers.saetze}" required></label>
      <label>Pause (Sek.)<input name="pause" type="number" inputmode="numeric" min="0" value="${pers.pause_sek}" required></label>
    </div>
    <label>Meine Einstellung am Gerät<input name="notiz" value="${esc(pers.notiz)}" placeholder="z. B. Sitz Stufe 4, Lehne 2"></label>
    ${!darfPool ? `<label>Meine Push/Pull-Zuordnung${gruppeSelect('meinegruppe', pers.gruppe || '', false, 'wie für alle' + (g && (g.gruppe || ausName(g.name).gruppe) ? ` (${GRUPPEN[g.gruppe || ausName(g.name).gruppe]})` : ''))}</label>` : ''}
    ${neu ? '' : `<label class="check"><input type="checkbox" name="pausiert" ${pers.pausiert ? 'checked' : ''}> Pausiert (derzeit nicht genutzt)</label>`}`
    : `<div class="abschnitt">Mein Training</div><button type="button" class="ghost block" id="favAn">☆ In mein Training übernehmen</button>`}
    <div class="actions">${!neu && darfPool ? '<button type="button" class="ghost danger" id="delG">Löschen</button><span class="spacer"></span>' : ''}
      <button type="button" class="ghost" data-close>Abbrechen</button>${darfPool || zeigePers ? '<button class="primary" type="submit">Speichern</button>' : ''}</div>
  </form>`);
  const persWerte = f => ({ saetze: +f.saetze.value, pause_sek: +f.pause.value, notiz: f.notiz.value.trim() || null,
    ...(f.pausiert ? { pausiert: f.pausiert.checked } : {}), ...(f.meinegruppe ? { gruppe: f.meinegruppe.value || null } : {}) });
  // Beim neuen Gerät: Muskelgruppe und Push/Pull aus dem Namen vorschlagen, solange nicht selbst geändert
  if (neu) {
    const f = $('#gF'); let katSelbst = false, grSelbst = false;
    f.kategorie.addEventListener('input', () => katSelbst = true);
    f.gruppe.addEventListener('change', () => grSelbst = true);
    f.name.addEventListener('input', () => {
      const v = ausName(f.name.value);
      if (!katSelbst) f.kategorie.value = v.kategorie || '';
      if (!grSelbst) f.gruppe.value = v.gruppe || '';
    });
  }
  $('#favAn')?.addEventListener('click', async () => { await favoritAn(g); toast('★ In dein Training übernommen'); geraetForm(g); render(); });
  $('#gF').onsubmit = async ev => {
    ev.preventDefault(); const f = ev.target;
    const pool = { name: f.name.value.trim(), kategorie: f.kategorie.value.trim() || null, gruppe: f.gruppe.value || null };
    if (neu) {
      const gleich = S.geraete.find(x => x.name.trim().toLowerCase() === pool.name.toLowerCase());
      if (gleich) {
        if (!confirm(`„${gleich.name}“ gibt es schon im Pool. Stattdessen dieses Gerät in dein Training übernehmen?`)) return;
        await favoritAn(gleich, persWerte(f)); dlg.close(); toast('★ In dein Training übernommen'); render(); return;
      }
      const ng = await q(sb.from('geraete').insert(pool).select().single());
      S.geraete.push(ng); await favoritAn(ng, persWerte(f));
    } else {
      if (darfPool && (pool.name !== g.name || pool.kategorie !== (g.kategorie || null) || pool.gruppe !== (g.gruppe || null)))
        Object.assign(g, await q(sb.from('geraete').update(pool).eq('id', g.id).select().single()));
      if (m) Object.assign(m, await q(sb.from('meine_geraete').update(persWerte(f)).eq('user_id', S.user.id).eq('geraet_id', g.id).select().single()));
    }
    sortG(); dlg.close(); toast('Gespeichert'); render();
  };
  $('#delG')?.addEventListener('click', async () => {
    const n = eintraegeVon(g.id).length;
    if (!confirm(`„${g.name}“ aus dem Pool löschen?${n ? ` Dabei werden auch deine ${n} Trainingseinträge gelöscht.` : ''}\n\nTipp: Wenn du es nur nicht mehr nutzt, entferne stattdessen den ★ oder pausiere es.`)) return;
    const res = await sb.from('geraete').delete().eq('id', g.id).select();
    if (res.error) return toast(res.error.message, true);
    if (!res.data?.length) return toast('Kann nicht gelöscht werden – das Gerät wird von anderen Nutzern verwendet.', true);
    S.geraete = S.geraete.filter(x => x.id !== g.id); S.meine = S.meine.filter(x => x.geraet_id !== g.id);
    S.eintraege = S.eintraege.filter(x => x.geraet_id !== g.id);
    dlg.close(); toast('Gelöscht'); render();
  });
}

// ---------- Körper ----------
function renderKoerper() {
  const l = S.koerper[0], vor = S.koerper[1];
  let delta = '';
  if (l && vor && l.gewicht_kg != null && vor.gewicht_kg != null) {
    const d = l.gewicht_kg - vor.gewicht_kg;
    delta = ` · Gewicht seit ${fmtDatum(vor.datum)}: ${d > 0 ? '+' : ''}${fmt(d)} kg`;
  }
  const mitCharts = S.koerper.length > 1 && window.Chart;
  setApp(`<button class="primary block" id="neuK">+ Messung eintragen</button>
    ${l ? `<div class="card stats">
      <div><span>Gewicht</span><b>${fmt(l.gewicht_kg)}</b><span>kg</span></div>
      <div><span>Muskel</span><b>${fmt(l.muskel_pct)}</b><span>%</span></div>
      <div><span>Fett</span><b>${fmt(l.fett_pct)}</b><span>%</span></div>
      <div><span>Inneres Fett</span><b>${fmt(l.viszeral_fett)}</b><span>Level</span></div>
      <div class="full muted small">Stand ${fmtDatum(l.datum)}${delta}</div></div>` : '<div class="card empty muted">Noch keine Messungen.</div>'}
    ${mitCharts ? `<div class="card"><div class="chartbox"><canvas id="kc1"></canvas></div></div>
      <div class="card"><div class="chartbox"><canvas id="kc2"></canvas></div></div>` : ''}
    ${S.koerper.length ? `<div class="card list">${S.koerper.map(k => `<div class="item" data-id="${k.id}"><div><b>${fmtDatum(k.datum)}</b>
      <div class="muted small">${fmt(k.gewicht_kg)} kg · Muskel ${fmt(k.muskel_pct)} % · Fett ${fmt(k.fett_pct)} % · Inneres Fett ${fmt(k.viszeral_fett)}</div>
      ${k.notiz ? `<div class="muted small">${esc(k.notiz)}</div>` : ''}</div><button class="ghost small">Bearbeiten</button></div>`).join('')}</div>` : ''}`);
  $('#neuK').onclick = () => koerperForm();
  app.querySelectorAll('.list .item').forEach(el => el.querySelector('button').onclick = () => koerperForm(S.koerper.find(x => x.id === el.dataset.id)));
  if (mitCharts) {
    const asc = [...S.koerper].reverse(), labels = asc.map(k => fmtDatum(k.datum));
    linienChart($('#kc1'), labels, [{ label: 'Gewicht (kg)', data: asc.map(k => k.gewicht_kg == null ? null : Number(k.gewicht_kg)) }]);
    linienChart($('#kc2'), labels, [
      { label: 'Muskel %', data: asc.map(k => k.muskel_pct == null ? null : Number(k.muskel_pct)) },
      { label: 'Fett %', data: asc.map(k => k.fett_pct == null ? null : Number(k.fett_pct)) },
      { label: 'Inneres Fett', data: asc.map(k => k.viszeral_fett == null ? null : Number(k.viszeral_fett)) }
    ]);
  }
}

function koerperForm(k) {
  const d = k || {};
  const v = x => x == null ? '' : fmt(x);
  oeffneDlg(`<form id="kF" class="form">
    <h2>${k ? 'Messung bearbeiten' : 'Neue Messung'}</h2>
    <label>Datum<input type="date" name="datum" value="${d.datum || heute()}" required></label>
    <div class="grid2">
      <label>Gewicht (kg)<input name="gew" inputmode="decimal" value="${v(d.gewicht_kg)}"></label>
      <label>Muskel (%)<input name="mus" inputmode="decimal" value="${v(d.muskel_pct)}"></label>
      <label>Fett (%)<input name="fett" inputmode="decimal" value="${v(d.fett_pct)}"></label>
      <label>Inneres Fett (Level)<input name="visz" inputmode="decimal" value="${v(d.viszeral_fett)}"></label>
    </div>
    <label>Notiz<input name="notiz" value="${esc(d.notiz)}" placeholder="optional, z. B. morgens nüchtern"></label>
    <div class="actions">${k ? '<button type="button" class="ghost danger" id="delK">Löschen</button><span class="spacer"></span>' : ''}
      <button type="button" class="ghost" data-close>Abbrechen</button><button class="primary" type="submit">Speichern</button></div>
  </form>`);
  $('#kF').onsubmit = async ev => {
    ev.preventDefault(); const f = ev.target;
    const row = { datum: f.datum.value, gewicht_kg: num(f.gew.value), muskel_pct: num(f.mus.value), fett_pct: num(f.fett.value), viszeral_fett: num(f.visz.value), notiz: f.notiz.value.trim() || null };
    const werte = [row.gewicht_kg, row.muskel_pct, row.fett_pct, row.viszeral_fett];
    if (werte.every(x => x == null)) return toast('Bitte mindestens einen Wert eintragen', true);
    if (werte.some(x => x != null && isNaN(x))) return toast('Bitte nur Zahlen eintragen', true);
    if (k) Object.assign(k, await q(sb.from('koerperwerte').update(row).eq('id', k.id).select().single()));
    else S.koerper.push(await q(sb.from('koerperwerte').insert(row).select().single()));
    sortK(); dlg.close(); toast('Gespeichert'); render();
  };
  if (k) $('#delK').onclick = async () => {
    if (!confirm('Diese Messung löschen?')) return;
    await q(sb.from('koerperwerte').delete().eq('id', k.id));
    S.koerper = S.koerper.filter(x => x.id !== k.id); dlg.close(); render();
  };
}

// ---------- Diagramme ----------
function linienChart(canvas, labels, datasets) {
  if (!window.Chart || !canvas) return;
  const cs = getComputedStyle(document.documentElement), c = n => cs.getPropertyValue(n).trim();
  const farben = [c('--accent'), c('--warn'), c('--c3'), c('--c4')];
  const zweiAchsen = datasets.some(d => d.yAxisID === 'y1');
  return new Chart(canvas, {
    type: 'line',
    data: { labels, datasets: datasets.map((d, i) => ({ borderColor: farben[i], backgroundColor: farben[i], tension: .25, pointRadius: 3, spanGaps: true, ...d })) },
    options: {
      responsive: true, maintainAspectRatio: false, interaction: { mode: 'index', intersect: false },
      plugins: { legend: { labels: { color: c('--muted'), boxWidth: 12 } } },
      scales: {
        x: { ticks: { color: c('--muted'), maxRotation: 0, autoSkip: true }, grid: { color: c('--line') } },
        y: { position: 'left', ticks: { color: c('--muted') }, grid: { color: c('--line') } },
        ...(zweiAchsen ? { y1: { position: 'right', ticks: { color: c('--muted') }, grid: { drawOnChartArea: false } } } : {})
      }
    }
  });
}

})();
</script>
</body>
</html>
